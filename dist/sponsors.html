unds=[...(await response.json()),...custom].filter(r=>{try{validateRound(r);return true}catch{return false}});const list=document.querySelector('#sponsors');list.replaceChildren();for(const brand of catalogue(rounds)){const card=document.createElement('article');card.className='sponsor-card';const title=document.createElement('h2');title.textContent=brand.name;const detail=document.createElement('p');detail.textContent=brand.aliases.length?'Also accepts '+brand.aliases.join(', '):'Type the brand name as shown.';card.append(title,detail);list.append(card)}if(!list.children.length)list.textContent='The library is being updated.'}catch{document.querySelector('#sponsors').textContent='Sponsor list unavailable. Please reload.'}</script></body></html>
